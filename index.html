<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contador</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h1>Contador</h1>
    <p class="numero" id="numero">0</p>
    <p>Pulsa los botones para cambiar el número</p>
    <div class="botones">
      <button id="botonSumar">+1</button>
      <button id="botonRestar">-1</button>
      <button id="botonReiniciar">Reiniciar</button>
    </div>
    <script src="script.js"></script>
  </body>
</html>
